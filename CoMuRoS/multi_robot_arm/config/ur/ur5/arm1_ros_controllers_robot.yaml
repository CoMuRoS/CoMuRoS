
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true
    
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # forward_velocity_controller:
    #   type: velocity_controllers/JointGroupVelocityController

    # forward_position_controller:
    #   type: position_controllers/JointGrdoupPositionController

    # rgripper_controller1:
    #   type: position_controllers/GripperActionController
    #   # type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - arm1_shoulder_pan_joint
      - arm1_shoulder_lift_joint
      - arm1_elbow_joint
      - arm1_wrist_1_joint
      - arm1_wrist_2_joint
      - arm1_wrist_3_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    type: joint_trajectory_controller/JointTrajectoryController
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      arm1_shoulder_pan_joint: { trajectory: 0.25, goal: 0.1 }
      arm1_shoulder_lift_joint: { trajectory: 0.25, goal: 0.1 }
      arm1_elbow_joint: { trajectory: 0.25, goal: 0.1 }
      arm1_wrist_1_joint: { trajectory: 0.25, goal: 0.1 }
      arm1_wrist_2_joint: { trajectory: 0.25, goal: 0.1 }
      arm1_wrist_3_joint: { trajectory: 0.25, goal: 0.1 }
    use_sim_time: true

